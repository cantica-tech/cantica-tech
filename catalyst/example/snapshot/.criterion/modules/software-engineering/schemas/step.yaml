id_prefix: STEP
name: Step
plural_name: Steps
folder: steps
grounding: inherited
grounding_field: Parent

fields:
  - name: ID
    kind: text
    required: true
  - name: Status
    kind: enum
    required: true
    allowed_values:
      - planned
      - in-progress
      - done
      - abandoned
  - name: Parent
    kind: ref
    required: true
    target_type: REQ|BUG

workflow:
  initial: planned
  states:
    - planned
    - in-progress
    - done
    - abandoned
  closed_states:
    - done
    - abandoned
