id_prefix: FEAT
name: Feature
plural_name: Features
folder: features
grounding: none

fields:
  - name: ID
    kind: text
    required: true
  - name: Status
    kind: enum
    required: true
    allowed_values:
      - Draft
      - Triaged
      - Active
      - Completed
      - Abandoned

workflow:
  initial: Draft
  states:
    - Draft
    - Triaged
    - Active
    - Completed
    - Abandoned
  closed_states:
    - Completed
    - Abandoned
