id: software-engineering
name: Software Engineering Process Module
version: 2.2.0
description: Standard software engineering process module governing requirements, bugs, house-keeping, tests, steps, features, and roadmaps.
grounding_type: rule

entity_types:
  - id: BUG
    schema: schemas/bug.yaml
  - id: REQ
    schema: schemas/requirement.yaml
  - id: HK
    schema: schemas/house-keeping.yaml
  - id: TEST
    schema: schemas/test.yaml
  - id: STEP
    schema: schemas/step.yaml
  - id: FEAT
    schema: schemas/feature.yaml
  - id: RM
    schema: schemas/roadmap.yaml

commands:
  - name: create-req
    description: Create a new rule-linked requirement artifact
    argument_hint: "[<rule-id>]"
    spec_path: commands/create-req.md
  - name: create-requirement
    description: Alias of create-req
    argument_hint: "[<rule-id>]"
    spec_path: commands/create-requirement.md
  - name: create-bug
    description: Create a new rule-linked bug artifact
    argument_hint: "[<rule-id>]"
    spec_path: commands/create-bug.md
  - name: create-test
    description: Create a new rule-linked test artifact
    argument_hint: "[<rule-id>]"
    spec_path: commands/create-test.md
  - name: create-feature
    description: Create a new feature artifact
    spec_path: commands/create-feature.md
  - name: create-step
    description: Create a new step artifact under a requirement or bug
    argument_hint: "<parent-id>"
    spec_path: commands/create-step.md
  - name: show-backlog
    description: Display work item and artifact backlog
    spec_path: commands/show-backlog.md
  - name: roadmap-add
    description: Ingest a new named roadmap from a local file
    argument_hint: "<name> <file>"
    spec_path: commands/roadmap-add.md
  - name: roadmap-remove
    description: Delete a named roadmap, or retire it in place if linked
    argument_hint: "<name>"
    spec_path: commands/roadmap-remove.md
  - name: roadmap-update
    description: Re-ingest a file as the new full version of a named roadmap
    argument_hint: "<name> <file>"
    spec_path: commands/roadmap-update.md
  - name: roadmap-merge
    description: Fold a partial delta file into an existing named roadmap
    argument_hint: "<name> <update file>"
    spec_path: commands/roadmap-merge.md

templates:
  - entity_type: BUG
    template_path: templates/bug.template.md
  - entity_type: REQ
    template_path: templates/requirement.template.md
  - entity_type: HK
    template_path: templates/house-keeping.template.md
  - entity_type: TEST
    template_path: templates/test.template.md
  - entity_type: STEP
    template_path: templates/step.template.md
  - entity_type: FEAT
    template_path: templates/feature.template.md
  - entity_type: RM
    template_path: templates/roadmap.template.md
  # Index (catalog) templates for the entity folders' index files.
  - entity_type: REQ
    template_path: templates/requirements.template.md
  - entity_type: FEAT
    template_path: templates/features.template.md

definitions:
  - entity_type: BUG
    path: definitions/bug/DEFINITION-BUG-v1.md
  - entity_type: REQ
    path: definitions/requirement/DEFINITION-REQUIREMENT-v1.md
  - entity_type: HK
    path: definitions/house-keeping/DEFINITION-HOUSE-KEEPING-v1.md
  - entity_type: TEST
    path: definitions/test/DEFINITION-TEST-v1.md
  - entity_type: STEP
    path: definitions/step/DEFINITION-STEP-v1.md
  - entity_type: FEAT
    path: definitions/feature/DEFINITION-FEATURE-v1.md
  - entity_type: RM
    path: definitions/roadmap/DEFINITION-ROADMAP-v1.md
  - entity_type: backlog
    path: definitions/backlog/DEFINITION-BACKLOG-v1.md

# Paths every deployment must carry (enforced by catalyst's check_deployment.py).
required_paths:
  - path: development/BACKLOG.md
    invariant: INV-14
    seed: templates/backlog.template.md
  - path: development/roadmaps/roadmaps.md
    invariant: INV-15
    seed: templates/roadmap.template.md

contributions:
  rules_of_rules: rules-of-rules.module.md
  code_of_conduct: code-of-conduct.module.md
  invariants: INVARIANTS.module.md
  taskfile: Taskfile.module.yml
  migrations: migrations/
